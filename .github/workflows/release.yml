name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version for manual builds (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  # ---- gate: run the full security pipeline first; nothing ships if it fails ----
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # ---- gate: run the unit + integration test suite; nothing ships if it fails ----
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # ---- server: build each image × platform on its own runner, push by digest ----
  docker:
    needs: [security, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          # backend panel (Go) — root Dockerfile
          - name: panel-api
            context: .
            dockerfile: ./Dockerfile
          # frontend web UI (Next.js) — web/Dockerfile
          - name: panel-web
            context: ./web
            dockerfile: ./web/Dockerfile
        platform:
          - linux/amd64
          - linux/arm64
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.component.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component.name }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---- server: assemble each image's multi-arch manifest from its digests ----
  docker-merge:
    runs-on: ubuntu-latest
    needs: [docker]
    strategy:
      fail-fast: false
      matrix:
        component: [panel-api, panel-web]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.component }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # On release, derive from the git tag; on dispatch, from the input.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE}:$(jq -r '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  # ---- client: cross-compile nodeagent binaries and attach to the release ----
  binaries:
    needs: [security, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          # Keenetic routers (Entware): aarch64-3.10 is covered by linux/arm64
          # above; the two MIPS families need their own builds. Their SoCs
          # (MT7621 1004Kc, ...) have no usable FPU, so softfloat is mandatory —
          # a hardfloat binary dies with SIGILL on the first float op.
          - goos: linux
            goarch: mipsle # mipsel-3.4 Entware target (little-endian)
            gomips: softfloat
          - goos: linux
            goarch: mips # mips-3.4 Entware target (big-endian)
            gomips: softfloat
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build nodeagent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
        run: |
          version="${{ github.event_name == 'release' && github.ref_name || inputs.version }}"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="nodeagent-${version}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" ./cmd/nodeagent
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nodeagent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARTIFACT }}

  # ---- client: build the userspace backend (amneziawg-go) for headerless hosts ----
  # Fallback the installer pulls when the kernel module can't be built (WSL2 etc).
  awg-go:
    needs: [security, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mipsle/mips are the Keenetic (Entware) targets: those routers can't
        # build the kernel module, so userspace is the ONLY backend there.
        include:
          - goarch: amd64
          - goarch: arm64
          - goarch: mipsle
            gomips: softfloat
          - goarch: mips
            gomips: softfloat
    env:
      # AmneziaWG userspace impl ref to build from (bump to pin a release).
      AWG_GO_REF: master
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Checkout amneziawg-go
        uses: actions/checkout@v7
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: ${{ env.AWG_GO_REF }}
          path: awg-go

      - name: Build amneziawg-go
        working-directory: awg-go
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
        run: |
          version="${{ github.event_name == 'release' && github.ref_name || inputs.version }}"
          out="amneziawg-go-${version}-linux-${GOARCH}"
          go build -trimpath -ldflags "-s -w" -o "../$out" .
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"
          # MIT requires the license notice ship with redistributed copies.
          cp LICENSE "../amneziawg-go-LICENSE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amneziawg-go-linux-${{ matrix.goarch }}
          path: |
            ${{ env.ARTIFACT }}
            amneziawg-go-LICENSE

      - name: Attach binary to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARTIFACT }}

      # The LICENSE is identical for every arch, so exactly ONE job may upload
      # it. Uploading the same asset name from several matrix jobs at once is a
      # race: the action replaces an existing asset by deleting it first, and
      # the loser then gets "Not Found" updating an asset that no longer exists.
      - name: Attach license to release (once)
        if: github.event_name == 'release' && matrix.goarch == 'amd64'
        uses: softprops/action-gh-release@v3
        with:
          files: amneziawg-go-LICENSE

  # ---- client: build the control-plane tools (awg, awg-quick) for the node ----
  # GPL-2.0, so the license text and the complete corresponding source are
  # bundled with the binaries (in each tarball) and attached to the release.
  # Built natively per-arch (awg is a C binary; awg-quick is an arch-independent
  # bash script) to avoid cross-compiling libmnl.
  awg-tools:
    needs: [security, tests]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # amneziawg-tools ref to build from (bump to pin a release).
      AWG_TOOLS_REF: master
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential libmnl-dev

      - name: Checkout amneziawg-tools
        uses: actions/checkout@v7
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ${{ env.AWG_TOOLS_REF }}
          path: awg-tools

      - name: Build and package
        run: |
          version="${{ github.event_name == 'release' && github.ref_name || inputs.version }}"
          arch="${{ matrix.arch }}"
          # Static-link awg (C) so the prebuilt binary runs on nodes with older
          # glibc than the runner (Debian 12, Ubuntu 22.04, ...). awg-quick is a
          # bash script and needs no linking.
          make -C awg-tools/src -j"$(nproc)" LDFLAGS=-static
          make -C awg-tools/src install DESTDIR="$PWD/stage" PREFIX=/usr LDFLAGS=-static
          file stage/usr/bin/awg || true

          mkdir -p dist
          cp stage/usr/bin/awg stage/usr/bin/awg-quick dist/
          cp awg-tools/COPYING dist/COPYING
          cat > dist/README.source <<EOF
          awg and awg-quick are built from amneziawg-tools, licensed under the
          GNU General Public License, version 2 (see COPYING).

          The complete corresponding source for this exact build is available
          from the same GitHub release:
            amneziawg-tools-${version}-source.tar.gz
          and upstream:
            https://github.com/amnezia-vpn/amneziawg-tools

          Written offer: for three years from the date you received these
          binaries you may obtain the corresponding source by either means
          above at no charge.
          EOF

          out="amneziawg-tools-${version}-linux-${arch}.tar.gz"
          tar -czf "$out" -C dist .
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

          # Corresponding source (GPL-2 section 3), attached once from amd64.
          src="amneziawg-tools-${version}-source.tar.gz"
          tar -czf "$src" -C awg-tools .
          echo "SRC_ARTIFACT=$src" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amneziawg-tools-linux-${{ matrix.arch }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.SRC_ARTIFACT }}

      - name: Attach binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARTIFACT }}

      - name: Attach corresponding source to release
        if: github.event_name == 'release' && matrix.arch == 'amd64'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.SRC_ARTIFACT }}

  # ---- client: the same tools for Keenetic/Entware routers (MIPS) ----
  # No GitHub-hosted MIPS runner exists, so these are cross-compiled with the
  # Debian cross toolchains. libmnl isn't packaged for those triplets either, so
  # it is built from source into a private sysroot and linked in statically —
  # which also makes awg independent of the router's libc (musl/uclibc).
  # Unlike the Go builds these stay hardfloat: the MIPS kernel emulates FP for
  # cores without an FPU, and Debian ships no soft-float MIPS libc to link.
  awg-tools-mips:
    needs: [security, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` matches the Go arch names used for every other asset, so the
          # installer's single nodeagent_arch mapping covers all of them.
          - arch: mipsle
            triplet: mipsel-linux-gnu
          - arch: mips
            triplet: mips-linux-gnu
    env:
      AWG_TOOLS_REF: master
      LIBMNL_VER: 1.0.5
    steps:
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential pkg-config \
            "gcc-${{ matrix.triplet }}" "libc6-dev-${{ matrix.arch == 'mipsle' && 'mipsel' || 'mips' }}-cross"

      - name: Build libmnl for ${{ matrix.triplet }}
        run: |
          curl -fsSL "https://www.netfilter.org/projects/libmnl/files/libmnl-${LIBMNL_VER}.tar.bz2" \
            | tar -xj
          cd "libmnl-${LIBMNL_VER}"
          ./configure --host=${{ matrix.triplet }} --prefix="$GITHUB_WORKSPACE/sysroot" \
            --enable-static --disable-shared
          make -j"$(nproc)"
          make install

      - name: Checkout amneziawg-tools
        uses: actions/checkout@v7
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ${{ env.AWG_TOOLS_REF }}
          path: awg-tools

      - name: Cross-build and package
        env:
          CC: ${{ matrix.triplet }}-gcc
          # wireguard-tools' Makefile finds libmnl via pkg-config; point it at
          # the cross sysroot only, so it can't pick up the host's x86 copy.
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/sysroot/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/sysroot
        run: |
          version="${{ github.event_name == 'release' && github.ref_name || inputs.version }}"
          arch="${{ matrix.arch }}"
          make -C awg-tools/src -j"$(nproc)" LDFLAGS=-static
          make -C awg-tools/src install DESTDIR="$PWD/stage" PREFIX=/usr LDFLAGS=-static
          file stage/usr/bin/awg
          # Guard against a silent host build: a wrong-arch binary would install
          # fine on the router and then fail with "cannot execute binary file".
          file stage/usr/bin/awg | grep -q MIPS || { echo "not a MIPS binary"; exit 1; }

          mkdir -p dist
          cp stage/usr/bin/awg stage/usr/bin/awg-quick dist/
          cp awg-tools/COPYING dist/COPYING
          cat > dist/README.source <<EOF
          awg and awg-quick are built from amneziawg-tools, licensed under the
          GNU General Public License, version 2 (see COPYING).

          The complete corresponding source for this exact build is available
          from the same GitHub release:
            amneziawg-tools-${version}-source.tar.gz
          and upstream:
            https://github.com/amnezia-vpn/amneziawg-tools

          Written offer: for three years from the date you received these
          binaries you may obtain the corresponding source by either means
          above at no charge.
          EOF

          out="amneziawg-tools-${version}-linux-${arch}.tar.gz"
          tar -czf "$out" -C dist .
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amneziawg-tools-linux-${{ matrix.arch }}
          path: ${{ env.ARTIFACT }}

      - name: Attach binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARTIFACT }}
